query RunInput {
  cart {
    buyerIdentity {
      customer {
        id
        hasB2bTag: hasAnyTag(tags: ["B2B", "Wholesale", "b2b", "wholesale"])
      }
    }
    cost {
      subtotalAmount {
        amount
        currencyCode
      }
    }
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          title
          product {
            id
            title
          }
        }
      }
    }
  }
  validation {
    metafield(namespace: "$app:b2b_validator", key: "rules_config") {
      value
    }
  }
}

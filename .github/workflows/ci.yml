# Runs on every pull request and every push to main. Render deploys a commit
# on main only after these checks pass (autoDeployTrigger: checksPass in
# render.yaml), so a change that breaks them never reaches merchants.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Type check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # SQLite file for the tests, created by `prisma migrate deploy` below.
      DATABASE_URL: file:./test.sqlite
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      # Later steps run even if an earlier check fails, so one run reports
      # every problem. The job still fails if any step fails.
      - name: Lint
        # "compact" output lets GitHub show each problem on the file and line.
        run: npm run lint -- --format compact

      - name: Create test database
        if: ${{ !cancelled() }}
        run: npx prisma migrate deploy

      - name: Unit and database tests
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Smoke test the built server
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: npm run test:smoke

  docker:
    name: Production image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Render builds this same Dockerfile, so check it builds before deploy.
      - name: Build the Docker image
        run: docker build --tag corkcount:ci .

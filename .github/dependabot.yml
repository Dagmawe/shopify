# Dependency updates for Corkcount. Kept deliberately quiet: one grouped pull
# request per ecosystem per month for minor and patch updates, and major
# versions left for a person to plan. Every pull request runs CI, and nothing
# reaches Render until CI passes on main.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Wait for a release to be used by others before updating to it.
    cooldown:
      default-days: 14
    ignore:
      # Major versions (TypeScript 7, ESLint 10, React 19, ...) need planned
      # migrations, so they're done by hand rather than by Dependabot.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Keep React Router at 7.18.2. 7.18.3 compares the full request origin on
      # form submissions, which breaks every action behind Render's HTTPS proxy
      # and `shopify app dev` (Shopify template issue #279). Security updates
      # are also blocked by this rule, so watch React Router advisories.
      - dependency-name: "react-router"
        versions: [">7.18.2"]
      - dependency-name: "@react-router/*"
        versions: [">7.18.2"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
